[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nori-id"
version = "0.1.0"
description = "Local-first identity and access foundation for Nori"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "phonenumbers>=8.13.50",
  "pycountry>=24.6",
  "argon2-cffi>=23.1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nori_id*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
