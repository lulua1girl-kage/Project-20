name: Build TaskForge APK

on:
  push:
    branches: [main]
    paths:
      - "apps/app-01-taskforge/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-taskforge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle and build
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.11.1"
          arguments: :apps:app-01-taskforge:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskForge-debug-apk
          path: apps/app-01-taskforge/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
