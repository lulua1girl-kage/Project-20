name: Nori ID tests

on:
  push:
    branches: [main, nori-id-foundation]
    paths:
      - "nori-id/**"
      - ".github/workflows/nori-id-tests.yml"
  pull_request:
    paths:
      - "nori-id/**"
      - ".github/workflows/nori-id-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nori-id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nori-id/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run automated tests
        run: pytest
