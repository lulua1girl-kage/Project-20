name: Build Nori Clock APK

on:
  push:
    branches: [main]
    paths:
      - "apps/app-03-clock/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-clock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.11.1"
          arguments: --version
      - name: Build Nori Clock
        run: gradle :apps:app-03-clock:assembleDebug --stacktrace
      - name: Run unit tests if present
        run: gradle :apps:app-03-clock:testDebugUnitTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nori-Clock-debug-apk
          path: apps/app-03-clock/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
