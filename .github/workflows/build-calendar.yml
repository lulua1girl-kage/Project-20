name: Build Calendar APK

on:
  push:
    branches: [main]
    paths:
      - "apps/app-02-calendar/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-calendar.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.11.1"
          arguments: --version

      - name: Build debug APK
        run: gradle :apps:app-02-calendar:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Calendar-debug-apk
          path: apps/app-02-calendar/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
